name: Sync telegramweb to webapp

on:
  push:
    branches:
      - main
      - master
    paths:
      - "bot2/telegramweb/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy telegramweb to webapp
        run: |
          rm -rf webapp/telegramweb
          cp -r bot2/telegramweb webapp/telegramweb

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add webapp/telegramweb/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: copy bot2/telegramweb to webapp/telegramweb"
            git push
          fi
